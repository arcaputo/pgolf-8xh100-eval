# python:3.12 (not -slim): Triton compiles a small C helper and needs gcc; git rebuilds the parent's code.
image = "python:3.12"
requirements = "requirements.txt"
# Data (sp1024: ~16 GB) a few minutes, then 4 runs (3 candidate seeds, 1 parent) of about 13-15 minutes each for the
# baseline (startup and compiling, 600 s of training, periodic validation, export and evaluation). A candidate may take
# up to 600 s more per run to evaluate, and sp4096 data is ~29 GB more, so the limit leaves room.
timeout_s = 9000
# A preempted spot run starts over from scratch; SkyPilot may recover it up to this many times.
max_retries = 3

[resources]
cpus = "32+"
memory = "256+"
# 8×H100 on GCP is a3-highgpu-8g: SXM on an HGX board with NVLink, the challenge's hardware.
accelerators = "H100:8"
use_spot = true
